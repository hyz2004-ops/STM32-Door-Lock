# ============================================================
#  智能门锁本地 MQTT 代理（Mosquitto）配置
#  - 1883: TCP 端口，给门锁 ESP8266 用（裸 TCP MQTT 报文）
#  - 9001: WebSocket 端口，给看板网页 index.html 用
#  - 匿名访问（门锁固件 mqtt.c 不支持用户名密码）
# ============================================================

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# 日志（排查时用，正常可注释掉）
# log_type all
